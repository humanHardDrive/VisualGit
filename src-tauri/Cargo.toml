[package]
name = "visualgit"
version = "0.1.0"
description = "A free, open-source Git branch explorer inspired by Plastic SCM"
license = "MIT"
edition = "2021"

[lib]
name = "visualgit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
