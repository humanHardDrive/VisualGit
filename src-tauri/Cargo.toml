[package]
name = "visualgit"
version = "1.0.0"
authors = ["Sam Stratter"]
repository = "https://github.com/humanHardDrive/VisualGit"
description = "A free, open-source Git branch explorer inspired by Plastic SCM"
license = "MIT"
edition = "2021"

[lib]
name = "visualgit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
trash = "5"
# Canonical paths without Windows' `\\?\` prefix, which git can't use (see os.rs).
dunce = "1"

[target.'cfg(windows)'.dependencies]
# ShellExecuteEx and the "Open with" dialog, for opening files and web pages (see os.rs).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
